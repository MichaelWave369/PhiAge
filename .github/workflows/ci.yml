name: PhiAge CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate synthetic fixture
        run: python -m phiage validate examples/synthetic-evidence.json
      - name: Check fixture never counts as empirical evidence
        run: |
          python -m phiage audit examples/synthetic-evidence.json > /tmp/phiage-audit.json
          python -c "import json; r=json.load(open('/tmp/phiage-audit.json')); assert all(x['independence_groups']==0 and x['stage']=='no-empirical-evidence' for x in r['hypotheses'])"
      - name: Registry candidate audit
        run: |
          python -m phiage sources data/source_registry.json > /tmp/phiage-source-audit.json
          python -c "import json; r=json.load(open('/tmp/phiage-source-audit.json')); assert r['source_count']==6 and r['analysis_ready_count']==0"
          python -c "from pathlib import Path; assert Path('data/source_registry.json').read_bytes() == Path('docs/sources.json').read_bytes()"
      - name: Validate primary-source GSM/library crosswalk
        run: |
          python -m phiage crosswalk --output /tmp/phiage-gsm-crosswalk.json
          python -c "import json; r=json.load(open('/tmp/phiage-gsm-crosswalk.json')); assert r['sample_to_column_verified'] is True and r['analysis_ready'] is False and len(r['mapped_samples']) == 9"
      - name: Verify committed technical QC observation is non-clinical
        run: |
          python -c "import json; from pathlib import Path; p=Path('data/receipts/GSE307377_feature_qc_summary_2026-11-21.json'); q=json.loads(p.read_text()); r=q['report']; assert r['analysis_ready'] is False and r['claim_level']=='TECHNICAL_QC_ONLY' and r['feature_rows']==r['informative_feature_rows']+r['all_sample_zero_rows']; assert sum(x['count'] for x in r['annotation_tokens'])==r['feature_rows']; assert p.read_bytes()==Path('docs/feature_qc_summary.json').read_bytes()"
      - name: Verify source-backed second-cohort receipt is non-clinical
        run: |
          python -c "import json; from pathlib import Path; p=Path('data/receipts/GSE113957_cohort_source_observation_2026-11-22.json'); x=json.loads(p.read_text()); assert x['analysis_ready'] is False and x['independent_replication_established'] is False and x['donor_independence_verified'] is False and x['claim_level']=='COHORT_METADATA_DISCOVERY_ONLY'; assert x['reported_disease_normal_labels']+x['reported_disease_hgps_labels']==x['observed_public_gsm_samples']==x['sample_title_fpkm_header_exact_matches']==x['sample_age_values_parsed']==143; assert p.read_bytes()==Path('docs/cohort_census_summary.json').read_bytes()"
      - name: Verify archived FPKM and RefSeq overlap observations remain non-clinical
        run: |
          python -c "import json; from pathlib import Path; p=Path('data/receipts/GSE113957_replication_qc_2026-11-22.json'); q=json.loads(p.read_text()); d=q['expression_qc']; assert q['analysis_ready'] is False and q['age_association_tested'] is False and q['donor_independence_verified'] is False and q['claim_level']=='TECHNICAL_REPLICATION_READINESS_QC_ONLY'; assert d['feature_rows']==d['all_sample_zero_feature_rows']+d['expressed_feature_rows']; assert q['sample_metadata_qc']['observed_gsm_count']==d['expression_sample_columns']; assert p.read_bytes()==Path('docs/replication_qc_summary.json').read_bytes()"
          python -c "import json; from pathlib import Path; p=Path('data/receipts/GSE113957_GSE307377_overlap_2026-11-22.json'); q=json.loads(p.read_text()); assert q['analysis_ready'] is False and q['expression_scale_harmonized'] is False and q['exact_refseq_identifier_overlap']+q['source_a_only_accessions']==q['GSE113957_unique_refseq_ids']; assert q['exact_refseq_identifier_overlap']+q['source_b_only_accessions']==q['GSE307377_unique_refseq_ids']; assert p.read_bytes()==Path('docs/transcript_overlap_summary.json').read_bytes()"
      - name: Validate frozen design report remains a blocked source-only audit
        run: |
          python -c "import json; from pathlib import Path; p=Path('data/receipts/GSE113957_design_preflight_2026-11-22.json'); d=json.loads(p.read_text()); assert d['analysis_ready'] is False and d['training_or_hypothesis_test_performed'] is False and d['donor_independence_verified'] is False and d['claim_level']=='DESIGN_FEASIBILITY_ONLY'; assert d['eligible_adult_healthy']['sample_count']==107 and d['primary_platform_healthy_adult']['sample_count']==94 and d['transport_platform_healthy_adult']['sample_count']==13; assert d['exploratory_transport_metadata_gate_passed'] is False and '50-59' in d['sparse_shared_age_decades']; assert p.read_bytes()==Path('docs/design_preflight_summary.json').read_bytes()"
      - name: Verify archived common-support source observation is blocked
        run: |
          python -c "import json; from pathlib import Path; p=Path('data/receipts/GSE113957_common_support_2026-11-22.json'); r=json.loads(p.read_text()); assert r['analysis_ready'] is False and r['age_effect_tested'] is False and r['sample_matching_performed'] is False and r['metadata_balance_thresholds_passed'] is False; assert r['primary_metadata']['n']==17 and r['comparison_metadata']['n']==11 and r['maximum_balanced_pair_capacity']==8; assert '40-49/female' in r['missing_strata'] and '30-39/female' in r['thin_strata']; assert p.read_bytes()==Path('docs/common_support_summary.json').read_bytes()"
      - name: Verify source-backed donor identity receipt remains blocked
        run: |
          python -c "import json; from pathlib import Path; p=Path('data/receipts/GSE113957_GSE307377_provenance_gate_2026-11-22.json'); x=json.loads(p.read_text()); a,b=x['source_cohorts']; assert x['analysis_ready'] is False and x['donor_independence_verified'] is False and x['cross_cohort_same_person_linkage_evaluable'] is False; assert a['geo_sample_records']==143 and b['geo_sample_records']==9; assert a['identity']['cell_id_field_present']==143 and b['identity']['cell_line_description_field_present']==9; assert a['identity']['subject_identifier_field_present']==0 and b['identity']['subject_identifier_field_present']==0; assert p.read_bytes()==Path('docs/provenance_gate_summary.json').read_bytes()"
      - name: Verify publication and biobank review against pinned source audit
        run: |
          python -m phiage review-provenance --output /tmp/phiage-review-v11.json
          python -c "import json; x=json.load(open('/tmp/phiage-review-v11.json')); assert x['analysis_ready'] is False and x['donor_independence_verified'] is False and x['blocked_review_gate_count']==8 and x['explicit_subject_id_field_count']==0 and x['geo_sample_level_passage_field_count']==0"
      - name: Validate static observatory JavaScript
        run: node --check docs/app.js
      - name: Compile Python
        run: python -m compileall -q phiage


  # Informational integration check. External GEO availability is not a software correctness criterion.
  live-geo-probe:
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public GEO source metadata and supplementary header
        run: python -m phiage geo-probe GSE307377 --allow-network --with-counts --with-tpm --output /tmp/phiage-geo-probe.json
      - name: Run structural expression QC against pinned public hashes
        run: python -m phiage expression-qc --allow-network --output /tmp/phiage-expression-qc.json
      - name: Run non-inferential feature and sample similarity QC
        run: python -m phiage feature-qc --allow-network --output /tmp/phiage-feature-qc.json
      - name: Summarize feature QC without biological claims
        run: |
          python -c "import json; x=json.load(open('/tmp/phiage-feature-qc.json')); print(json.dumps({'schema':x['schema_version'],'feature_rows':x['feature_rows'],'feature_id_syntax_counts':x['feature_id_syntax_counts'],'annotation_tokens':x['annotation_tail_literal_counts_top_12'],'all_sample_zero_rows':x['all_sample_zero_rows'],'informative_feature_rows':x['informative_feature_rows'],'nonzero_similarity_min':x['nonzero_similarity_min'],'nonzero_similarity_median':x['nonzero_similarity_median'],'nonzero_similarity_max':x['nonzero_similarity_max'],'similarity_min':x['similarity_min'],'similarity_median':x['similarity_median'],'similarity_max':x['similarity_max'],'analysis_ready':x['analysis_ready'],'claim_level':x['claim_level']},indent=2))"
      - name: Summarize numerical QC (not biological results)
        run: |
          python -c "import json; x=json.load(open('/tmp/phiage-expression-qc.json')); print(json.dumps({'schema':x['schema_version'], 'analysis_ready':x['analysis_ready'], 'tables':{name:{k:v for k,v in row.items() if k != 'sample_aggregate_descriptives'} for name,row in x['tables'].items()}},indent=2))"
      - name: Summarize source structure (not findings)
        run: |
          python -c "import json; p=json.load(open('/tmp/phiage-geo-probe.json')); print(json.dumps({'accession':p['accession'], 'matrix':p['series_matrix'], 'supplementary_table':p.get('supplementary_table'), 'normalized_table':p.get('normalized_table'), 'analysis_ready':p['analysis_ready']},indent=2))"

  candidate-cohort-census:
    # Informational: source discovery; never a clinical or biological claim.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe GSE113957 public Series Matrix metadata
        run: python -m phiage cohort-probe GSE113957 --allow-network --with-fpkm --output /tmp/phiage-gse113957-census.json
      - name: Assert conservative cohort readiness policy
        run: |
          python -c "import json; p=json.load(open('/tmp/phiage-gse113957-census.json')); assert p['public_gsm_sample_count']>0 and p['analysis_ready'] is False and isinstance(p['claimed_split_verified_from_metadata'],bool) and p['donor_independence_verified'] is False and p['claim_level']=='COHORT_METADATA_DISCOVERY_ONLY'; print(json.dumps(p,indent=2))"

  live-replication-readiness:
    # Nonblocking third-party source check: network failures are not source-code defects.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect pinned GSE113957 public SOFT and FPKM numerical matrix
        run: python -m phiage replication-qc --allow-network --output /tmp/phiage-replication-qc.json
      - name: Audit exact source transcript accession overlap
        run: python -m phiage transcript-overlap --allow-network --output /tmp/phiage-transcript-overlap.json
      - name: Summarize transcript identifier overlap (not biological equivalence)
        run: |
          python -c "import json; x=json.load(open('/tmp/phiage-transcript-overlap.json')); assert x['analysis_ready'] is False and x['expression_scale_harmonized'] is False; print(json.dumps(x,indent=2))"
      - name: Report aggregate technical checks only
        run: |
          python -c "import json; d=json.load(open('/tmp/phiage-replication-qc.json')); assert d['analysis_ready'] is False and d['age_association_tested'] is False and d['donor_independence_verified'] is False and d['claim_level']=='TECHNICAL_REPLICATION_READINESS_QC_ONLY'; print(json.dumps(d,indent=2))"

  live-design-preflight:
    # Informational source-metadata check, no models and no clinical conclusions.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run hash-pinned public cohort design feasibility audit
        run: python -m phiage design-preflight --allow-network --output /tmp/phiage-design-preflight.json
      - name: Assert experiment remains blocked from age-effect inference
        run: |
          python -c "import json; x=json.load(open('/tmp/phiage-design-preflight.json')); assert x['analysis_ready'] is False and x['donor_independence_verified'] is False and x['training_or_hypothesis_test_performed'] is False and x['claim_level']=='DESIGN_FEASIBILITY_ONLY'; print(json.dumps(x,indent=2))"

  live-common-support:
    # Informational public GEO metadata only. Never enables age modeling.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan pinned common age and sex support in public GSE113957 SOFT
        run: python -m phiage common-support --allow-network --output /tmp/phiage-common-support.json
      - name: Assert no biological effect or clinical readiness claims
        run: |
          python -c "import json; x=json.load(open('/tmp/phiage-common-support.json')); assert x['analysis_ready'] is False and x['age_effect_tested'] is False and x['sample_matching_performed'] is False and x['donor_independence_verified'] is False and x['claim_level']=='COMMON_SUPPORT_METADATA_AUDIT_ONLY'; print(json.dumps(x,indent=2))"

  live-provenance-gate:
    # Informational source-metadata audit. Never claims independent donor identity.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit source-pinned public donor and culture metadata coverage
        run: python -m phiage provenance-gate --allow-network --output /tmp/phiage-provenance-gate.json
      - name: Enforce blocked donor linkage and no clinical claim
        run: |
          python -c "import json; x=json.load(open('/tmp/phiage-provenance-gate.json')); assert x['analysis_ready'] is False and x['age_effects_tested'] is False and x['donor_independence_verified'] is False and x['cross_cohort_same_person_linkage_evaluable'] is False and x['claim_level']=='SOURCE_PROVENANCE_GAPS_ONLY'; print(json.dumps(x,indent=2))"

  live-original-supplement:
    # Optional original publisher download, technical structure only.
    # Network errors are evidence availability issues, not code failures.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect original Fleischer supplementary DOCX without exporting sample rows
        run: python -m phiage supplement-probe --allow-network --output /tmp/phiage-fleischer-supplement.json
      - name: Enforce absence of human donor and expression claims
        run: |
          python -c "import json; x=json.load(open('/tmp/phiage-fleischer-supplement.json')); assert x['analysis_ready'] is False and x['table_to_gsm_join_verified'] is False and x['supplement_sample_level_values_released'] is False and x['claim_level']=='SUPPLEMENT_STRUCTURE_ONLY'; print(json.dumps(x,indent=2))"
