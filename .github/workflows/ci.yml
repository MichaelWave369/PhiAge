name: PhiAge CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate synthetic fixture
        run: python -m phiage validate examples/synthetic-evidence.json
      - name: Check fixture never counts as empirical evidence
        run: |
          python -m phiage audit examples/synthetic-evidence.json > /tmp/phiage-audit.json
          python -c "import json; r=json.load(open('/tmp/phiage-audit.json')); assert all(x['independence_groups']==0 and x['stage']=='no-empirical-evidence' for x in r['hypotheses'])"
      - name: Registry candidate audit
        run: |
          python -m phiage sources data/source_registry.json > /tmp/phiage-source-audit.json
          python -c "import json; r=json.load(open('/tmp/phiage-source-audit.json')); assert r['source_count']==5 and r['analysis_ready_count']==0"
          python -c "from pathlib import Path; assert Path('data/source_registry.json').read_bytes() == Path('docs/sources.json').read_bytes()"
      - name: Compile Python
        run: python -m compileall -q phiage
